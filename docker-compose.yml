version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: alphaflow-postgres
    environment:
      POSTGRES_USER: alphaflow
      POSTGRES_PASSWORD: alphaflow123
      POSTGRES_DB: alphaflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphaflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alphaflow-net

  redis:
    image: redis:7-alpine
    container_name: alphaflow-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alphaflow-net

  app:
    build: .
    container_name: alphaflow-app
    environment:
      DATABASE_URL: postgresql://alphaflow:alphaflow123@postgres:5432/alphaflow
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_WS_URL: ws://localhost:3000
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - alphaflow-net
    command: npm run dev

  nginx:
    image: nginx:alpine
    container_name: alphaflow-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - alphaflow-net

volumes:
  postgres_data:
  redis_data:

networks:
  alphaflow-net:
    driver: bridge
