version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: alphaflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alphaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alphaflow123}
      POSTGRES_DB: ${POSTGRES_DB:-alphaflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alphaflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alphaflow-net

  redis:
    image: redis:7-alpine
    container_name: alphaflow-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alphaflow-net

  app:
    build: .
    container_name: alphaflow-app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-alphaflow}:${POSTGRES_PASSWORD:-alphaflow123}@postgres:5432/${POSTGRES_DB:-alphaflow}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3000}
      # Required: set a strong secret in .env — the app refuses to start in
      # production without a JWT_SECRET of at least 32 characters.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ chars) in your .env}
      JWT_EXPIRY: ${JWT_EXPIRY:-7d}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - alphaflow-net
    # Apply schema before serving; `db push` is idempotent for first boot.
    command: sh -c "npx prisma migrate deploy 2>/dev/null || npx prisma db push --skip-generate; npm start"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: alphaflow-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - alphaflow-net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  alphaflow-net:
    driver: bridge
